name: PR title

# Pull requests are squash-merged, so the title becomes the commit and the release note.
# It must be a conventional commit: feat:, fix:, docs:, chore:, ... (feat!: for a breaking change).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
