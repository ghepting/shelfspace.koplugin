name: Bug report
description: Something in ShelfSpace does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Device and firmware
      placeholder: Kobo Libra Colour, firmware 4.x
    validations:
      required: true
  - type: input
    id: koreader
    attributes:
      label: KOReader version
      description: Top menu › ? › About KOReader
      placeholder: v2026.07.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ShelfSpace version
      description: The release you installed, from the zip name or Tools › Plugin management
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: crash.log from KOReader's folder, or a screenshot. Remove anything private.
